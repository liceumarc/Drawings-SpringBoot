<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-8">

<main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <h1 class="text-center text-3xl font-bold text-indigo-600">Drawings</h1>
    <h2 class="mt-1 text-center text-slate-600">Iniciar sesión</h2>

    <p th:if="${param.registered != null}" role="status"
       class="mt-6 rounded-lg bg-green-100 px-4 py-3 text-sm text-green-800">
        Cuenta creada correctamente. Ya puedes iniciar sesión.
    </p>

    <p th:if="${message != null}" th:text="${message}" role="status"
       class="mt-6 rounded-lg bg-blue-100 px-4 py-3 text-sm text-blue-800">Mensaje</p>

    <form th:action="@{/login}" th:object="${loginForm}" method="post" class="mt-6 space-y-4">

        <div>
            <label for="username" class="block text-sm font-medium text-slate-700">Nombre de usuario</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username" autofocus
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" role="alert"
               class="mt-1 text-sm text-red-600"></p>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="current-password"
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"
               class="mt-1 text-sm text-red-600"></p>
        </div>

        <div th:if="${#fields.hasGlobalErrors()}" role="alert"
             class="rounded-lg bg-red-100 px-4 py-3 text-sm text-red-800">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p>
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
            Entrar
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
        ¿Todavía no tienes cuenta?
        <a th:href="@{/register}" class="font-medium text-indigo-600 hover:underline">Regístrate</a>
    </p>
</main>

</body>
</html>
