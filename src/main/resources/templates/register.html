<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-8">

<main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <h1 class="text-center text-3xl font-bold text-indigo-600">Drawings</h1>
    <h2 class="mt-1 text-center text-slate-600">Crear cuenta</h2>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" class="mt-6 space-y-4">

        <div>
            <label for="name" class="block text-sm font-medium text-slate-700">Nombre</label>
            <input type="text" id="name" th:field="*{name}" maxlength="50" autocomplete="name" required autofocus
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" role="alert"
               class="mt-1 text-sm text-red-600"></p>
        </div>

        <div>
            <label for="username" class="block text-sm font-medium text-slate-700">Nombre de usuario</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username" required
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" role="alert"
               class="mt-1 text-sm text-red-600"></p>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" minlength="5" maxlength="10"
                   autocomplete="new-password" required aria-describedby="password-help"
                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            <p id="password-help" class="mt-1 text-xs text-slate-500">
                Entre 5 y 10 caracteres, con mayúscula, minúscula y número.
            </p>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"
               class="mt-1 text-sm text-red-600"></p>
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
            Registrarse
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
        ¿Ya tienes cuenta?
        <a th:href="@{/login}" class="font-medium text-indigo-600 hover:underline">Inicia sesión</a>
    </p>
</main>

</body>
</html>
