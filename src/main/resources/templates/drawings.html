<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis dibujos')}"></head>
<body class="min-h-screen bg-slate-100">

<nav th:replace="~{fragments/layout :: navbar('mine')}"></nav>

<main class="mx-auto max-w-6xl px-4 py-8">

    <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold text-slate-800">Mis dibujos</h1>
        <a th:href="@{/drawings/new}"
           class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700">
            Nuevo dibujo
        </a>
    </div>

    <p th:if="${message != null}" th:text="${message}" role="status"
       class="mt-4 rounded-lg bg-green-100 px-4 py-3 text-sm text-green-800">Mensaje</p>

    <!-- Nothing sent yet -->
    <div th:if="${#lists.isEmpty(drawings)}" class="mt-6 rounded-2xl bg-white p-8 text-center shadow">
        <p class="text-slate-600">Todavía no has enviado ningún dibujo.</p>
        <a th:href="@{/drawings/new}"
           class="mt-4 inline-block rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700">
            Crear mi primer dibujo
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(drawings)}" class="mt-6 overflow-x-auto rounded-2xl bg-white shadow">
        <table class="w-full min-w-[40rem] text-left text-sm">
            <thead class="bg-slate-50 text-slate-600">
            <tr>
                <th scope="col" class="px-4 py-3 font-semibold">Nombre</th>
                <th scope="col" class="px-4 py-3 font-semibold">Objetos</th>
                <th scope="col" class="px-4 py-3 font-semibold">Creado</th>
                <th scope="col" class="px-4 py-3 font-semibold">Modificado</th>
                <th scope="col" class="px-4 py-3 text-right font-semibold">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${drawings}" class="border-t border-slate-100">
                <td class="px-4 py-3 font-medium text-slate-800" th:text="${d.name}">Nombre</td>
                <td class="px-4 py-3 text-slate-600" th:text="${d.objectCount}">0</td>
                <td class="px-4 py-3 text-slate-600"
                    th:text="${#temporals.format(d.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                <td class="px-4 py-3 text-slate-600"
                    th:text="${#temporals.format(d.updatedAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                <td class="px-4 py-3">
                    <div class="flex flex-wrap justify-end gap-2">
                        <a th:href="@{/drawings/{id}(id=${d.id})}"
                           class="rounded bg-indigo-600 px-3 py-1.5 text-white hover:bg-indigo-700">Ver / Editar</a>
                        <form th:action="@{/drawings/{id}/delete(id=${d.id})}" method="post"
                              onsubmit="return confirm('¿Seguro que quieres borrar este dibujo?')">
                            <button type="submit"
                                    class="rounded bg-red-600 px-3 py-1.5 text-white hover:bg-red-700">Borrar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
